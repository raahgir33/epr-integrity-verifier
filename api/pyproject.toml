[project]
name = "epr-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "google-genai>=0.8",
    "google-cloud-bigquery>=3.26",
    "google-cloud-storage>=2.18",
    "google-cloud-pubsub>=2.26",
    "earthengine-api>=1.1",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]
datagen = [
    "jinja2>=3.1",
    "playwright>=1.47",
    "pillow>=10.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
markers = [
    "requires_gcp: needs live Google Cloud credentials/network; skipped in CI (none currently use this — reserved for a future test that does).",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
