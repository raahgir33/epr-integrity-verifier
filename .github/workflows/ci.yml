name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: api (pytest, ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Test (no live GCP credentials; requires_gcp-marked tests skipped)
        run: uv run pytest -q -m "not requires_gcp"

  web:
    name: web (lint, typecheck, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
      
      - name: Generate Next.js route types
        run: npx next typegen
        working-directory: web

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
